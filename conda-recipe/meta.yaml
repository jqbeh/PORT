{% set name = "port" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/jqbeh/PORT/archive/refs/tags/v{{ version }}.tar.gz
  # after tagging the release, fill in with:
  #   curl -sL https://github.com/jqbeh/PORT/archive/refs/tags/v{{ version }}.tar.gz | sha256sum
  sha256: REPLACE_WITH_SHA256_OF_RELEASE_TARBALL

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  run:
    - nextflow >=24.10.3
    - openjdk >=17
    - bash

test:
  commands:
    - port --version
    - port --help
    - test -f $PREFIX/share/port/main.nf

about:
  home: https://github.com/jqbeh/PORT
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "PORT (Plasmid Outbreak Reporting Tool): Nextflow pipeline for Nanopore plasmid assembly, extraction, typing, AMR detection, annotation and clustering."
  description: |
    PORT assembles Oxford Nanopore reads (Autocycler or Dragonflye), extracts
    circular plasmid contigs, and runs QUAST, AMRFinderPlus, MOB-suite,
    PlasmidFinder, Bakta and (optionally) Pling. The analysis tools run from
    Docker containers by default; see the documentation for the conda profile.
  doc_url: https://jqbeh.github.io/PORT/
  dev_url: https://github.com/jqbeh/PORT

extra:
  recipe-maintainers:
    - jqbeh
